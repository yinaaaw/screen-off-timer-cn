name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签（如 v1.3.9-zh）'
        required: true
        default: 'v1.3.9-zh'
      prerelease:
        description: '是否标记为预发布'
        required: false
        default: 'false'
  push:
    branches:
      - master
    paths:
      - 'release-trigger.txt'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Resolve tag name
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            PRE="${{ inputs.prerelease }}"
          else
            # push 触发：从 release-trigger.txt 读取标签名，缺省用默认
            if [ -f release-trigger.txt ]; then
              TAG=$(head -1 release-trigger.txt | tr -d '[:space:]')
            fi
            [ -z "$TAG" ] && TAG="v1.3.9-zh"
            PRE="false"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "prerelease=$PRE" >> $GITHUB_OUTPUT
          echo "解析标签: $TAG"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare keystore (optional)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "store_file=$RUNNER_TEMP/release.keystore" >> $GITHUB_OUTPUT
            echo "signed=true" >> $GITHUB_OUTPUT
            echo "::notice::检测到正式签名密钥，将使用正式签名构建"
          else
            echo "signed=false" >> $GITHUB_OUTPUT
            echo "::warning::未配置签名密钥，将使用 debug 签名构建（不可用于正式分发）"
          fi

      - name: Build release APK
        env:
          SIGNING_STORE_FILE: ${{ steps.keystore.outputs.store_file }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Verify signature
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "=== apksigner verify ==="
          "$BT/apksigner" verify --print-certs "$APK" || true

      - name: Rename APK
        id: apk
        run: |
          SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          DST="screen-off-timer-zh.apk"
          cp "$SRC" "$DST"
          echo "apk=$DST" >> $GITHUB_OUTPUT
          echo "sha256=$(sha256sum "$DST" | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          ls -lh "$DST"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          draft: false
          generate_release_notes: true
          body: |
            ## 熄屏定时器 · 简体中文版

            基于 [doniarifin/screen-off-timer](https://github.com/doniarifin/screen-off-timer) `f517676` 构建的汉化版本。

            ### 汉化内容
            - 新增 `values-zh-rCN` 中文本地化资源（64 条文案）
            - 界面全部文案资源化，随系统语言自动切换
            - 英文设备仍显示原英文界面

            ### 安装说明
            - 最低支持 Android 7.0 (API 24)
            - 应用包名 `com.inod.screenofftimer`
            - 与官方 F-Droid 版签名不同，切换时需先卸载原版

            > ⚠️ 本版本使用 **debug 签名**，仅供测试安装，不适用于正式分发。

            ### 校验信息
            - SHA256: `${{ steps.apk.outputs.sha256 }}`
          files: ${{ steps.apk.outputs.apk }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ steps.apk.outputs.apk }}
          retention-days: 30
