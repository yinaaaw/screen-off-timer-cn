name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签（如 v1.3.9-zh）'
        required: true
        default: 'v1.3.9-zh'
      prerelease:
        description: '是否标记为预发布'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::未配置 KEYSTORE_BASE64 Secret，无法进行正式签名"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "store_file=$RUNNER_TEMP/release.keystore" >> $GITHUB_OUTPUT
          ls -lh "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        env:
          SIGNING_STORE_FILE: ${{ steps.keystore.outputs.store_file }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Verify signature
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK: $APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "使用 build-tools: $BT"
          "$BT/apksigner" verify --print-certs "$APK"
          echo "=== 签名校验通过 ==="

      - name: Rename APK
        id: apk
        run: |
          SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          DST="screen-off-timer-${GITHUB_REF_NAME//\//-}-zh.apk"
          cp "$SRC" "$DST"
          echo "apk=$DST" >> $GITHUB_OUTPUT
          echo "sha256=$(sha256sum "$DST" | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          ls -lh "$DST"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          draft: false
          generate_release_notes: true
          body: |
            ## 熄屏定时器 · 简体中文版

            基于 [doniarifin/screen-off-timer](https://github.com/doniarifin/screen-off-timer) `f517676` 构建的汉化版本。

            ### 汉化内容
            - 新增 `values-zh-rCN` 中文本地化资源（64 条文案）
            - 界面全部文案资源化，随系统语言自动切换
            - 英文设备仍显示原英文界面

            ### 安装说明
            - 最低支持 Android 7.0 (API 24)
            - 本版本使用独立签名，与官方 F-Droid 版签名不同，如需切换请先卸载原版
            - 应用包名沿用 `com.inod.screenofftimer`

            ### 校验信息
            - SHA256: `${{ steps.apk.outputs.sha256 }}`
          files: ${{ steps.apk.outputs.apk }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ steps.apk.outputs.apk }}
          retention-days: 30
