name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - zh-cn
    paths-ignore:
      - '**.md'
      - 'fastlane/**'
      - 'screenshot/**'

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Show pre-installed Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "--- 预装 platforms ---"
          ls -1 "$ANDROID_HOME/platforms" 2>/dev/null || echo "(无)"
          echo "--- 预装 build-tools ---"
          ls -1 "$ANDROID_HOME/build-tools" 2>/dev/null || echo "(无)"
          echo "--- cmdline-tools ---"
          ls -1 "$ANDROID_HOME/cmdline-tools" 2>/dev/null || echo "(无)"

      - name: Install SDK components if missing
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK_ROOT=$SDK_ROOT"

          # 定位 sdkmanager
          SDKMGR=""
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMGR="$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -1)"
          fi
          echo "sdkmanager=$SDKMGR"

          if [ -n "$SDKMGR" ]; then
            # compileSdk = 36.1 (AGP9 DSL: release(36){ minorApiLevel = 1 })
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" "platforms;android-36" > /dev/null 2>&1 || true
            "$SDKMGR" "platforms;android-36.1" > /dev/null 2>&1 || true
            "$SDKMGR" "build-tools;36.0.0" > /dev/null 2>&1 || true
            echo "--- 安装后 platforms ---"
            ls -1 "$SDK_ROOT/platforms" 2>/dev/null || true
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Rename and list APK
        id: apk
        run: |
          mkdir -p out
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::未找到 APK 产物"
            find app/build/outputs -type f || true
            exit 1
          fi
          DST="out/screen-off-timer-zh-cn-release.apk"
          cp "$APK" "$DST"
          echo "apk=$DST" >> $GITHUB_OUTPUT
          ls -lh out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: screen-off-timer-zh-cn-release
          path: out/screen-off-timer-zh-cn-release.apk
          retention-days: 90
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/
            app/build/outputs/logs/
          retention-days: 7
          if-no-files-found: ignore
